<!DOCTYPE html> 
<html lang="en">

<head>

    <meta charset="UTF-8"> <!-- Ορισμός χαρακτήρων -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive εμφάνιση -->

    <title>TripAd-Vice-or - Bad Habits</title> <!-- Τίτλος σελίδας -->

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <!-- Σύνδεση CSS -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap"
          rel="stylesheet"> <!-- Γραμματοσειρά Poppins -->

</head>

<body>

    <header> <!-- Επικεφαλίδα -->

        <div class="logo"> <!-- Περιοχή λογότυπου -->

            <a href="{{ url_for('home') }}"> <!-- Link για αρχική -->

                <img src="{{ url_for('static', filename='images/logo.png') }}"
                     alt="TripAd-Vice-or Logo"> <!-- Εικόνα logo -->

            </a>

        </div>

        <nav> <!-- Μενού πλοήγησης -->

            <a href="{{ url_for('home') }}">Home</a> <!-- Link Home -->

            <a href="{{ url_for('items') }}">Bad Habits</a> <!-- Link Bad Habits -->

        </nav>

    </header>

    <main> <!-- Κύριο περιεχόμενο -->

        <section class="section"> <!-- Ενότητα bad habits -->

            <h1>Explore Bad Habits</h1> <!-- Τίτλος ενότητας -->

            <div class="search-bar"> <!-- Μπάρα αναζήτησης -->

                <input type="text"
                       id="search-input"
                       placeholder="Search for a bad habit..."> <!-- Πεδίο αναζήτησης -->

                <select id="category-filter"> <!-- Dropdown κατηγοριών -->

                    <option value="">All</option> <!-- Όλες οι κατηγορίες -->
                    <option value="Health">Health</option>
                    <option value="Sleep">Sleep</option>
                    <option value="Food">Food</option>
                    <option value="Productivity">Productivity</option>
                    <option value="Technology">Technology</option>
                    <option value="Addiction">Addiction</option>

                </select>

                <button id="search-button">Search</button> <!-- Κουμπί αναζήτησης -->

            </div>

            <div id="items-container" class="card-grid"></div> <!-- Εδώ εμφανίζονται τα cards -->

        </section>

    </main>

    <footer> <!-- Footer -->

        <p>TripAd-Vice-or | Web Information Systems Project 2026 ©</p> <!-- Κείμενο footer -->

    </footer>

    <script src="{{ url_for('static', filename='items.js') }}"></script> <!-- Σύνδεση JavaScript -->

</body>

</html>
