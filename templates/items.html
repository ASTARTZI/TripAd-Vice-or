<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripAd-Vice-or - Bad Habits</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap"
          rel="stylesheet">
</head>

<body>

    <header>

        <div class="logo">
            <a href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}"
                     alt="TripAd-Vice-or Logo">
            </a>
        </div>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('items') }}">Bad Habits</a>
        </nav>

    </header>

    <main>

        <section class="section">

            <h1>Explore Bad Habits</h1>

            <div class="search-bar">

                <input type="text"
                       id="search-input"
                       placeholder="Search for a bad habit...">

                <select id="category-filter">

                    <option value="">All</option>
                    <option value="Health">Health</option>
                    <option value="Sleep">Sleep</option>
                    <option value="Food">Food</option>
                    <option value="Productivity">Productivity</option>
                    <option value="Technology">Technology</option>
                    <option value="Addiction">Addiction</option>

                </select>

                <button id="search-button">Search</button>

            </div>

            <div id="items-container" class="card-grid"></div>

        </section>

    </main>

    <footer>
        <p>TripAd-Vice-or | Web Information Systems Project 2026 ©</p>
    </footer>

    <script src="{{ url_for('static', filename='items.js') }}"></script>

</body>

</html>
